services:
  postgres:
    image: postgres:15-alpine
    container_name: golf_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-golf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-golf_password}
      POSTGRES_DB: ${POSTGRES_DB:-golf_league_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-golf_user} -d ${POSTGRES_DB:-golf_league_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: golf_backend_prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-golf_user}:${POSTGRES_PASSWORD:-golf_password}@postgres:5432/${POSTGRES_DB:-golf_league_db}
      SECRET_KEY: ${SECRET_KEY}
      GOLF_API_KEY: ${GOLF_API_KEY}
      GOLF_API_BASE_URL: https://live-golf-data.p.rapidapi.com
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENABLE_AUTO_SYNC: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: golf_frontend_prod
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data_prod:
